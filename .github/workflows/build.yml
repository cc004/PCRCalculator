name: Build server

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  server:
    name: Linux .NET server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test server packaging
        run: python3 scripts/test_build_server.py
      - name: Build project server package
        run: ./build.sh --target linux
      - uses: actions/upload-artifact@v4
        with:
          name: PCRCalculatorServer_linux-x64_${{ github.sha }}
          path: Builds/mzq-linux-x64.zip
          if-no-files-found: error
